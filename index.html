<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>MAME Hub1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: system-ui, sans-serif;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* The stage holds the artwork and its hotspots.
     It scales to fit the viewport while keeping the image's aspect ratio.
     Reserves 320px total (160px each side) for the arrows. */
  #stage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width:  min(calc(100vw - 320px), calc(100vh * 0.7384));   /* 1084 / 1468 ≈ 0.7384 */
    height: min(100vh, calc((100vw - 320px) * 1.3542));       /* 1468 / 1084 ≈ 1.3542 */
  }

  /* Artwork fills the stage */
  #stage > img {
    width: 100%;
    height: 100%;
    display: block;
    pointer-events: none;   /* clicks pass through to hotspots */
    user-select: none;
  }

  /* ---- Prev / Next neon chevron arrows ---- */
  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 100px;
    z-index: 100;
    cursor: pointer;
    outline: none;
    filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.55));
    transition: filter 0.2s ease, transform 0.2s ease;
  }

  .arrow img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
    user-select: none;
    -webkit-user-drag: none;
  }

  .arrow:hover,
  .arrow:focus-visible {
    filter:
      drop-shadow(0 0 14px rgba(0, 255, 255, 1))
      drop-shadow(0 0 34px rgba(0, 200, 255, 0.85));
    transform: translateY(-50%) scale(1.08);
  }

  .arrow:active {
    transform: translateY(-50%) scale(0.95);
  }

  /* Glue the arrows to the outside edges of the stage with a small gap. */
  .arrow-left {
    right: 100%;
    margin-right: 20px;
  }

  .arrow-right {
    left: 100%;
    margin-left: 20px;
  }

  /* ---- Grid coordinates (percentages of the image) ----
     Tweak these if any hotspot is a touch off. */
  :root {
    /* Columns (unchanged — you said these are perfect) */
    --c1: 3.0%;
    --c2: 35.0%;
    --c3: 67.0%;
    --cw: 30.0%;

    /* Rows */
    --r1: 1.5%;    /* top of row 1 — you said this is perfect */
    --rp: 19.1%;   /* row pitch (distance between row tops)  ← was 20% */
    --rh: 18.5%;   /* row height                             ← unchanged */
  }

  /* Column + row utility classes */
  .c1 { left: var(--c1); }
  .c2 { left: var(--c2); }
  .c3 { left: var(--c3); }

  .r1 { top: var(--r1); }
  .r2 { top: calc(var(--r1) + var(--rp)); }
  .r3 { top: calc(var(--r1) + var(--rp) * 2); }
  .r4 { top: calc(var(--r1) + var(--rp) * 3); }
  .r5 { top: calc(var(--r1) + var(--rp) * 4); }

  /* The clickable hotspots */
  .hotspot {
    position: absolute;
    display: block;
    width: var(--cw);
    height: var(--rh);
    background: transparent;
    border-radius: 14px;
    cursor: pointer;
    transition: box-shadow 0.15s ease, background 0.15s ease;
    z-index: 10;
  }

  /* Arcade-style glow on hover/focus */
  .hotspot:hover,
  .hotspot:focus-visible {
    background: rgba(0, 200, 255, 0.12);
    box-shadow:
      0 0 22px rgba(0, 200, 255, 0.9),
      0 0 60px rgba(0, 200, 255, 0.5),
      inset 0 0 18px rgba(0, 200, 255, 0.45);
    outline: none;
  }

  /* Brief "press" feedback */
  .hotspot:active {
    background: rgba(0, 200, 255, 0.25);
  }

  /* Narrow screens: shrink arrows and reserved space */
  @media (max-width: 700px) {
    #stage {
      width:  min(calc(100vw - 170px), calc(100vh * 0.7384));
      height: min(100vh, calc((100vw - 170px) * 1.3542));
    }
    .arrow { width: 55px; }
    .arrow-left  { margin-right: 10px; }
    .arrow-right { margin-left: 10px; }
  }
</style>
</head>
<body>

  <div id="stage">
    <!-- Rename this file if your artwork has a different name -->
    <img src="Main1.png" alt="MAME Hub — Arcade Game Selector">

    <!-- Row 1 -->
    <a class="hotspot r1 c1" href="altbeast.html"     aria-label="Altered Beast"></a>
    <a class="hotspot r1 c2" href="asteroid.html"      aria-label="Asteroids"></a>
    <a class="hotspot r1 c3" href="baddude.html"     aria-label="Bad Dudes"></a>

    <!-- Row 2 -->
    <a class="hotspot r2 c1" href="blockout.html"  aria-label="Blockout"></a>
    <a class="hotspot r2 c2" href="bobble.html"    aria-label="Puzzle Bobble"></a>
    <a class="hotspot r2 c3" href="bstar.html"    aria-label="Blazing Star"></a>

    <!-- Row 3 -->
    <a class="hotspot r3 c1" href="buggy.html"     aria-label="Buggy Challenge"></a>
    <a class="hotspot r3 c2" href="chasehq.html"       aria-label="Chase HQ"></a>
    <a class="hotspot r3 c3" href="ddragon.html"   aria-label="Double Dragon."></a>

    <!-- Row 4 -->
    <a class="hotspot r4 c1" href="gaiden.html"   aria-label="Ninja Gaiden"></a>
    <a class="hotspot r4 c2" href="ghouls.html"    aria-label="Ghouls N Ghosts"></a>
    <a class="hotspot r4 c3" href="jedi.html"  aria-label="Return of the Jedi"></a>

    <!-- Row 5 -->
    <a class="hotspot r5 c1" href="joust.html"    aria-label="Joust"></a>
    <a class="hotspot r5 c2" href="jungle.html"   aria-label="Jungle Hunt"></a>
    <a class="hotspot r5 c3" href="wwf.html" aria-label="Champion Wrestler"></a>

    <!-- Prev / Next arrows — INSIDE the stage so they stay glued to the grid -->
    <a class="arrow arrow-left"
       href="https://djm3n4c3.github.io/mamehub/index.html"
       aria-label="Previous page">
      <img src="prev.png" alt="Previous page">
    </a>

    <a class="arrow arrow-right"
       href="https://djm3n4c3.github.io/mamehub2/index.html"
       aria-label="Next page">
      <img src="next.png" alt="Next page">
    </a>
  </div>

</body>
</html>
